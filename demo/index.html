<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemma 4 26B Inference Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fbfaf8;
        --panel: #ffffff;
        --panel-soft: #f4f3f0;
        --border: #e5e2dc;
        --text: #292724;
        --muted: #77736d;
        --accent: #292724;
        --accent-hover: #4a4640;
        --user: #f0eee9;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      .app { width: min(820px, 100%); margin: 0 auto; padding: 26px 20px; }
      header { margin-bottom: 8px; text-align: center; }
      .site-header {
        position: sticky; top: 0; z-index: 20; padding: 16px 0 12px;
        background: rgba(251, 250, 248, .94); backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(229, 226, 220, .85);
      }
      h1 { margin: 0 0 4px; font-size: clamp(1.25rem, 3vw, 1.55rem); font-weight: 650; letter-spacing: -.02em; }
      .subtitle { color: var(--muted); margin: 0; }
      .meta {
        display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px;
        justify-content: center; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px;
        background: rgba(255, 255, 255, .7); color: var(--muted); font-size: .76rem;
      }
      .meta strong { color: var(--text); font-weight: 600; }
      .meta code { color: #706a62; word-break: break-all; }
      #speed {
        color: #176b45; background: #e5f5eb; border: 1px solid #b9e4c9;
        padding: 2px 9px; border-radius: 999px; font-weight: 700; white-space: nowrap;
      }
      #ttft { color: #315d9a; background: #eaf1fb; border: 1px solid #c7d9f2; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
      #tokens { color: #73539c; background: #f2ecfa; border: 1px solid #ddcef0; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
      .samples { margin: 16px auto 0; width: min(760px, 100%); text-align: left; }
      .samples summary { width: fit-content; margin: auto; color: var(--muted); cursor: pointer; font-size: .82rem; }
      .sample-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin-top: 12px; }
      .sample-button { width: 100%; height: auto; padding: 9px 10px; text-align: left; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); color: var(--text); font-size: .78rem; font-weight: 500; }
      .sample-button:hover { background: var(--panel-soft); }
      .clear-button {
        width: auto; height: auto; padding: 2px 7px; border: 0; border-radius: 6px;
        background: transparent; color: var(--muted); font-size: .76rem;
      }
      .clear-button:hover { background: var(--panel-soft); color: var(--text); }

      #chat {
        min-height: 430px; display: flex; flex-direction: column; gap: 24px;
        padding: 25px 0 125px;
      }
      .message { display: flex; gap: 10px; align-items: flex-start; }
      .message.user { justify-content: flex-end; }
      .bubble {
        max-width: min(760px, 92%); padding: 0; border-radius: 15px;
        white-space: pre-wrap; overflow-wrap: anywhere; font-size: .98rem;
      }
      .assistant .bubble { padding-left: 2px; }
      .user .bubble { background: var(--user); padding: 10px 14px; }
      .label { color: var(--muted); font-size: .72rem; margin: 0 0 5px 0; font-weight: 600; }
      .bubble p { margin: 0 0 11px; }
      .bubble p:last-child { margin-bottom: 0; }
      .bubble h1, .bubble h2, .bubble h3 { margin: 0 0 9px; line-height: 1.3; }
      .bubble h1 { font-size: 1.3rem; }
      .bubble h2 { font-size: 1.15rem; }
      .bubble h3 { font-size: 1.03rem; }
      .bubble ul, .bubble ol { margin: 4px 0 11px 22px; padding: 0; }
      .bubble li { margin: 3px 0; }
      .bubble code { padding: 2px 5px; border-radius: 5px; background: var(--panel-soft); font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; }
      .bubble pre { overflow-x: auto; margin: 8px 0 11px; padding: 12px; border: 1px solid var(--border); border-radius: 9px; background: #f5f3ef; }
      .bubble pre code { padding: 0; background: transparent; }
      .bubble a { color: #496bba; }

      .composer {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        width: min(864px, calc(100% - 36px)); display: flex; gap: 9px;
        padding: 9px; border: 1px solid #d8d4cd; border-radius: 18px;
        background: rgba(255, 255, 255, .96); box-shadow: 0 8px 30px rgba(57, 49, 40, .12);
      }
      textarea {
        flex: 1; min-height: 42px; max-height: 150px; resize: vertical;
        border: 0; outline: 0; border-radius: 10px; padding: 10px 12px;
        background: var(--panel-soft); color: var(--text); font: inherit;
      }
      textarea::placeholder { color: #9a958c; }
      button {
        align-self: flex-end; width: 42px; height: 42px; border: 0; border-radius: 10px;
        background: var(--accent); color: white; cursor: pointer; font-size: 1.15rem;
      }
      button:hover { background: var(--accent-hover); }
      button:disabled { opacity: .5; cursor: wait; }
      .empty { color: var(--muted); text-align: center; margin: auto; }
      .error { color: #ff9b9b; }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="site-header">
        <h1>Gemma 4 26B inference</h1>
        <p class="subtitle">Streaming response demo through the local SSH tunnel.</p>
        <div class="meta">
          <span>Model: <strong id="model-name">gemma-4-26B-A4B-it-NVFP4</strong></span>
          <span>URL: <code id="endpoint">http://127.0.0.1:8000/v1/chat/completions</code></span>
          <span id="speed">Speed: —</span>
          <span id="ttft">TTFT: —</span>
          <span id="tokens">Tokens: —</span>
          <button class="clear-button" id="clear" type="button">Clear chat</button>
        </div>
        <details class="samples">
          <summary>Load a benchmark-style sample prompt</summary>
          <div class="sample-grid" id="sample-grid"></div>
        </details>
      </header>

      <section id="chat" aria-live="polite">
        <div class="empty" id="empty">Ask a question to see the model stream its answer.</div>
      </section>
    </main>

    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="Message Gemma..." aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send message" title="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 4.8 20 12 4 19.2l2.1-5.8L15.5 12 6.1 10.6 4 4.8Z" fill="currentColor" />
        </svg>
      </button>
    </form>

    <script>
      const MODEL = "gemma-4-26B-A4B-it-NVFP4";
      const ENDPOINT = "http://127.0.0.1:8000/v1/chat/completions";
      const MAX_TOKENS = 8192;
      const chat = document.getElementById("chat");
      const promptBox = document.getElementById("prompt");
      const send = document.getElementById("send");
      const composer = document.getElementById("composer");
      const clear = document.getElementById("clear");
      const sampleGrid = document.getElementById("sample-grid");
      const samplesPanel = sampleGrid.closest("details");
      const speed = document.getElementById("speed");
      const ttft = document.getElementById("ttft");
      const tokens = document.getElementById("tokens");
      let activeController = null;

      const samples = [
        { label: "1 · Secure local AI server", prompt: `Write a detailed 1,000-word guide titled "How to Build a Secure Local AI Server".
Cover hardware, GPU memory, inference engines, model loading, API serving, authentication, logging, monitoring and security.
Do not stop until the guide is complete.` },
        { label: "2 · 100 enterprise uses", prompt: `Generate 100 practical uses of AI in an enterprise.
Number them 1–100.
Each item must be exactly one sentence.
Start immediately without an introduction.` },
        { label: "3 · FastAPI AI gateway", prompt: `Build a complete Python FastAPI application for an internal AI gateway.
Include authentication, rate limiting, request logging, model routing, token counting, health checks, error handling and Docker deployment.
Provide complete runnable code and explain the architecture afterward.` },
        { label: "4 · SOC credential compromise", prompt: `You are a senior SOC analyst.
Create a detailed incident-response playbook for a suspected credential compromise.
Include detection logic, investigation steps, evidence collection, containment, eradication, recovery and lessons learned.
Include example SIEM queries and pseudocode where useful.` },
        { label: "5 · LLM infrastructure reasoning", prompt: `A company has 100 developers using an internal LLM.
Each developer sends 30 requests per day.
Average input is 4,000 tokens and average output is 800 tokens.

Design the infrastructure required to serve them locally.
Estimate throughput, concurrency, GPU requirements and bottlenecks.
Explain your calculations step by step.` },
        { label: "6 · 50-risk AI register", prompt: `Create a comprehensive AI risk register containing 50 risks for an enterprise deploying generative AI.

Return a Markdown table with:
ID | Risk | Threat Scenario | Impact | Likelihood | Controls | Residual Risk

Make every entry distinct and technically meaningful.` },
        { label: "7 · JSON incident dataset", prompt: `Generate a valid JSON dataset containing 100 fictional cybersecurity incidents.

Each object must contain:
incident_id
timestamp
attack_type
source_ip
target_system
severity
mitre_technique
description
recommended_action

Return JSON only.` },
        { label: "8 · Malaysian payment ecosystem", prompt: `Explain Malaysia's payment ecosystem to a new cybersecurity engineer.
Cover DuitNow, FPX, IBG, MyDebit, payment gateways, banks and payment network operators.
Explain how a payment transaction flows from customer to merchant and where cybersecurity risks can arise.
Write approximately 1,000 words.

Don't use this as an accuracy benchmark without independently validating facts, but it's useful for testing locally relevant language generation.` },
        { label: "9 · Bahasa Melayu finance", prompt: `Terangkan bagaimana kecerdasan buatan generatif boleh digunakan dengan selamat dalam sebuah institusi kewangan di Malaysia.
Berikan 20 contoh penggunaan, risiko utama, dan kawalan yang perlu dilaksanakan.
Jawab sepenuhnya dalam Bahasa Melayu.` },
        { label: "10 · 50-agent SOC showcase", prompt: `You are designing a futuristic cybersecurity operations centre powered by AI agents.

Describe 50 specialised AI agents.
For each agent provide:
Name → Purpose → Input → Action → Output

Make each agent genuinely different.
Start immediately with Agent 1 and continue through Agent 50.` },
      ];

      for (const sample of samples) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sample-button";
        button.textContent = sample.label;
        button.addEventListener("click", () => {
          promptBox.value = sample.prompt;
          promptBox.focus();
          promptBox.style.height = "auto";
          promptBox.style.height = `${Math.min(promptBox.scrollHeight, 150)}px`;
          samplesPanel.open = false;
        });
        sampleGrid.append(button);
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[character]));
      }

      // Small, dependency-free Markdown renderer for model output.
      function renderMarkdown(source) {
        let html = escapeHtml(source);
        html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
        html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
        html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
        html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
        html = html.replace(/^[-*] (.+)$/gm, "<li>$1</li>");
        html = html.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");
        html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
        html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
        html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
        return html.split(/\n{2,}/).map((block) => {
          if (/^<(h[1-3]|pre|ul)>/.test(block)) return block;
          return `<p>${block.replace(/\n/g, "<br>")}</p>`;
        }).join("");
      }

      function scrollToLatest() {
        requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight));
      }

      function addMessage(role, text = "") {
        document.getElementById("empty")?.remove();
        const wrapper = document.createElement("article");
        wrapper.className = `message ${role}`;
        const content = document.createElement("div");
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = role === "user" ? "You" : "Gemma 4 26B";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.dataset.raw = text;
        if (role === "assistant") bubble.innerHTML = renderMarkdown(text);
        else bubble.textContent = text;
        content.append(label, bubble);
        wrapper.append(content);
        chat.append(wrapper);
        scrollToLatest();
        return bubble;
      }

      async function streamAnswer(prompt, bubble) {
        activeController = new AbortController();
        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: MODEL,
            messages: [{ role: "user", content: prompt }],
            max_tokens: MAX_TOKENS,
            temperature: 0.7,
            stream: true,
            stream_options: { include_usage: true },
          }),
          signal: activeController.signal,
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        if (!response.body) throw new Error("The browser did not receive a streaming response.");

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        const requestStartedAt = performance.now();
        let firstTokenAt = null;
        let startedAt = null;
        let generatedText = "";
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const events = buffer.split("\n\n");
          buffer = events.pop() || "";
          for (const event of events) {
            const line = event.split("\n").find((item) => item.startsWith("data: "));
            if (!line) continue;
            const data = line.slice(6).trim();
            if (data === "[DONE]") return;
            try {
              const chunk = JSON.parse(data);
              const content = chunk.choices?.[0]?.delta?.content;
              if (chunk.usage?.completion_tokens && startedAt) {
                const elapsed = (performance.now() - startedAt) / 1000;
                speed.textContent = `Speed: ${(chunk.usage.completion_tokens / elapsed).toFixed(1)} tok/s`;
                tokens.textContent = `Tokens: ${chunk.usage.completion_tokens}`;
              }
              if (content) {
                if (!firstTokenAt) {
                  firstTokenAt = performance.now();
                  ttft.textContent = `TTFT: ${(firstTokenAt - requestStartedAt).toFixed(0)} ms`;
                }
                if (!startedAt) startedAt = performance.now();
                generatedText += content;
                bubble.dataset.raw += content;
                bubble.innerHTML = renderMarkdown(bubble.dataset.raw);
                const estimatedTokens = Math.max(1, Math.round(generatedText.length / 4));
                const elapsed = Math.max((performance.now() - startedAt) / 1000, 0.001);
                speed.textContent = `Speed: ${(estimatedTokens / elapsed).toFixed(1)} tok/s (est.)`;
                tokens.textContent = `Tokens: ~${estimatedTokens}`;
                scrollToLatest();
              }
            } catch (_) { /* Ignore incomplete/non-content SSE frames. */ }
          }
          if (done) break;
        }
        activeController = null;
      }

      composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const prompt = promptBox.value.trim();
        if (!prompt || send.disabled) return;
        promptBox.value = "";
        addMessage("user", prompt);
        const bubble = addMessage("assistant");
        send.disabled = true;
        speed.textContent = "Speed: starting…";
        ttft.textContent = "TTFT: waiting…";
        tokens.textContent = "Tokens: 0";
        try {
          await streamAnswer(prompt, bubble);
        } catch (error) {
          bubble.className += " error";
          bubble.textContent = `Unable to reach the model: ${error.message}`;
        } finally {
          activeController = null;
          send.disabled = false;
          promptBox.focus();
        }
      });

      clear.addEventListener("click", () => {
        activeController?.abort();
        activeController = null;
        chat.innerHTML = '<div class="empty" id="empty">Ask a question to see the model stream its answer.</div>';
        promptBox.value = "";
        speed.textContent = "Speed: —";
        ttft.textContent = "TTFT: —";
        tokens.textContent = "Tokens: —";
        send.disabled = false;
        promptBox.focus();
        window.scrollTo(0, 0);
      });

      promptBox.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) composer.requestSubmit();
      });
    </script>
  </body>
</html>
